<div *ngIf="getCarnetUrl()">
  <img
    id="open-modal"
    expand="block"
    (click)="writeNfcTag()"
    [src]="getCarnetUrl()"
    alt="Carnet del usuario"
  />
  <ion-modal
    #modal
    trigger="open-modal"
    [initialBreakpoint]="0.25"
    [breakpoints]="[0, 0.25, 0.5, 0.75]"
    *ngIf="isNfcSupported && showMenu"
  >
    <ng-template>
      <ion-content>
        <div id="modal-content">
          <ion-icon name="radio-outline" size="large" class="nfc-icon"></ion-icon>
          <p class="nfc-message">NFC activado, acerca el teléfono a un lector</p>
          <p id="countdown" class="countdown">Cerrando en {{ countdown }} segundos...</p>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</div>

<div *ngIf="!getCarnetUrl() && getIsLoggedIn()">
  <p>Cargando carnet...</p>
</div>
<div *ngIf="!getIsLoggedIn()">
  <p>Inicia sesión para ver tu carnet.</p>
</div>

<ion-alert *ngIf="isNfcSupported && !showMenu"
  trigger="open-modal"
  header="Activar NFC para acceder a esta función."
  [buttons]="alertButtons"
></ion-alert>
