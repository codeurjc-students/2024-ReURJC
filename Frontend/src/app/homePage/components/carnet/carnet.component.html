<div *ngIf="getCarnetUrl()">
  <img  id="open-modal" expand="block" (click)="writeNfcTag()" [src]="getCarnetUrl()" alt="Carnet del usuario" />
  <ion-modal #modal trigger="open-modal" [initialBreakpoint]="0.25" [breakpoints]="[0, 0.25, 0.5, 0.75]" *ngIf="isNfcSupported && showMenu">
    <ng-template>
      <ion-content>
        <div id="content-placeholder">
          <ion-icon name="radio-outline" size="large"></ion-icon>
        </div>
        <p>NFC activado, acerca el teléfono a un lector</p>
      </ion-content>
    </ng-template>
  </ion-modal>
</div>
<div *ngIf="!getCarnetUrl() && getIsLoggedIn()">
  <p>Cargando carnet...</p>
</div>
<div *ngIf="!getIsLoggedIn()">
  <p>Inicia sesión para ver tu carnet.</p>
</div>
