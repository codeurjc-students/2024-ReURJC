<VirtualHost *:80>
  # Nombre del servidor (cambiar a tu dominio si tienes uno)
  ServerName localhost
  # Opcional: ServerAlias www.tu-dominio.com

  # Directorio raíz de tu sitio Moodle
  DocumentRoot /var/www/html

  # Configuración del directorio
  <Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  # Configuración de logs (opcional pero recomendado)
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  # Configuraciones adicionales de PHP (opcional)
  # php_value upload_max_filesize 100M
  # php_value post_max_size 100M
  # php_value memory_limit 256M
  # php_value max_execution_time 300
  # php_value max_input_time 300
</VirtualHost>