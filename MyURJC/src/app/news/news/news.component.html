<ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let news of newsList" class="news-container">
        <ion-card >
          <ion-card-header>
            <ion-card-title style="color: #CB0017;">{{ news.title }}</ion-card-title>
            <ion-card-subtitle>{{ news.date }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p><strong> {{ news.description}}</strong></p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
</ion-grid>

<ion-footer>
  <ion-toolbar>
    <div class="pagination-buttons">
      <ion-button (click)="previousPage()" [disabled]="pageNumber === 0">Anterior</ion-button>
      <ion-button (click)="nextPage()" [disabled]="disableNextPage">Siguiente</ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
