

<ion-list>
  <ion-card *ngFor="let notification of notifications">
    <ion-card-header>
      <ion-card-title>Nueva nota en {{ notification.subjectId.title }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>
        Se ha evaluado:  {{ notification.nameMark }} con una nota de <b>{{ notification.mark }}</b>. Convocatoria: {{ notification.convocatory }}
      </p>
    </ion-card-content>
  </ion-card>
</ion-list>


  <ion-list>
    <ion-card *ngFor="let notification of dbNotifications">
      <ion-card-header>
        <ion-card-title>{{ notification.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        {{ notification.description }}
      </ion-card-content>
    </ion-card>
  </ion-list>
