spring.datasource.url=jdbc:mysql://localhost:3306/tfgdb
spring.datasource.username=root
spring.datasource.password=password
jwt.secret=change_me

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8080
server.tomcat.connection-timeout=0
server.tomcat.max-threads=200

# General API Info
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Output Directory
springdoc.api-docs.resolve-output=true
springdoc.api-docs.output=api-docs.yaml

# Disable caching to avoid issues with static file updates
springdoc.cache.disabled=true


