# Database Configuration (Ajusta el nombre del servicio si usas Docker Compose)
spring.datasource.url=jdbc:mysql://reurjc_mysql_1:3306/tfgdb
spring.datasource.username=root
spring.datasource.password=12345678
jwt.secret=change_me

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop

# Tomcat Configuration
# server.tomcat.connection-timeout=0 
server.tomcat.max-threads=200

# Springdoc (OpenAPI) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.resolve-output=true
springdoc.api-docs.output=api-docs.yaml
springdoc.cache.disabled=true

# HTTPS Configuration
server.port=8443  
